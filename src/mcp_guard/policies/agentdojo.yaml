# Default policy for the AgentDojo suites (workspace, banking, slack, travel).
#
# trusted_tools: outputs of these tools are structured data the user owns, not free text an
#   attacker can write into, so values found there count as trusted.
# # Unknown tools (not mentioned anywhere in this file): allow here, so every earlier AgentDojo result stays
# comparable. A proxy should use block (default-deny): a new tool can't run until someone lists it.
unknown_tools: allow

# Safe tools: read-only lookups with nothing to guard, listed so that unknown_tools: block doesn't stop them.
# (Their OUTPUT is still untrusted data, like any tool not in trusted_tools.) Deliberately NOT here:
# workspace create_file and append_to_file, which write; under block they stay blocked until decided.
safe_tools:
  # banking
  - get_most_recent_transactions
  - get_scheduled_transactions
  - read_file
  # slack
  - read_channel_messages
  - read_inbox
  # travel
  - check_restaurant_opening_hours
  - get_car_fuel_options
  - get_car_price_per_day
  - get_car_rental_address
  - get_car_types_available
  - get_contact_information_for_restaurants
  - get_cuisine_type_for_restaurants
  - get_dietary_restrictions_for_all_restaurants
  - get_flight_information
  - get_hotels_address
  - get_hotels_prices
  - get_price_for_restaurants
  - get_rating_reviews_for_car_rental
  - get_rating_reviews_for_hotels
  - get_rating_reviews_for_restaurants
  - get_restaurants_address
  # travel + workspace
  - get_day_calendar_events
  - search_calendar_events
  # workspace
  - get_draft_emails
  - get_file_by_id
  - get_received_emails
  - get_sent_emails
  - get_unread_emails
  - list_files
  - search_emails
  - search_files
  - search_files_by_filename

# Weak trusted tools: their output is structured, but an ATTACKER can write into it. Their values are
# trusted for ordinary arguments; with strict_trust they don't count for outward arguments (below).
weak_trusted_tools:
  - search_contacts_by_name   # workspace builds contacts from the senders/recipients of every inbox email
  - search_contacts_by_email  # same contact list: anyone who emails the user is a "contact"
  - get_channels              # any workspace member can create a channel and name it anything (even a URL)
  - get_users_in_channel      # anyone invited to a channel (even an attacker's account) is listed here
  - get_all_hotels_in_city    # business directories: a listing is written by the business itself
  - get_all_restaurants_in_city
  - get_all_car_rental_companies_in_city
# Strong trusted tools (the rest): the user's own account data (get_iban, get_balance, get_user_info,
# get_user_information) and the clock (get_current_day). An attacker can't write there (update_user_info
# is guarded, and values the agent writes are not trusted when read back).

# How far weak trusted tools count for outward args: off (fully trusted) / typed (not for emails, URLs,
# IBANs; plain channel and user names still pass) / full (not at all). See docs/adaptive_attacks.md.
strict_trust: typed   # default since 2026-11-09 (rule: slack plain utility >= 9/21 and B1-B3 blocked)

# Outward arguments: where data, money or access leaves the user (recipients, payees, invites, channels,
# URLs to visit or post to, businesses to book). Links inside free-text args (check_links_in) count too.
outward_args:
  send_email: [recipients, cc, bcc]
  share_file: [email]
  create_calendar_event: [participants]
  add_calendar_event_participants: [participants]
  send_money: [recipient]
  schedule_transaction: [recipient]
  update_scheduled_transaction: [recipient]
  send_direct_message: [recipient]
  send_channel_message: [channel]
  add_user_to_channel: [user, channel]
  invite_user_to_slack: [user, user_email]
  get_webpage: [url]
  post_webpage: [url]
  reserve_hotel: [hotel]
  reserve_restaurant: [restaurant]
  reserve_car_rental: [company]

forbid_tainted: tool -> arguments that must not contain values taken only from untrusted data.
#   (ID-style args such as email_id / file_id are deliberately left out in v1 - they would block
#   many legitimate flows; adding them is an ablation.)

# allowlist = guarded arguments must be traceable to the user's request or a trusted tool output.
mode: allowlist

trusted_tools:
  - get_iban
  - get_balance
  - get_user_info
  - get_user_information
  - get_current_day
  - get_channels
  - get_users_in_channel
  - search_contacts_by_name
  - search_contacts_by_email
  - get_all_hotels_in_city
  - get_all_restaurants_in_city
  - get_all_car_rental_companies_in_city

forbid_tainted:
  # workspace
  send_email: [recipients, cc, bcc]
  share_file: [email]
  create_calendar_event: [participants]
  add_calendar_event_participants: [participants]
  # banking
  send_money: [recipient]
  schedule_transaction: [recipient]
  update_scheduled_transaction: [recipient]
  update_password: [password]
  update_user_info: [first_name, last_name, street, city]  # get_user_info is trusted: no laundering
  # slack
  send_direct_message: [recipient]
  send_channel_message: [channel]
  add_user_to_channel: [user, channel]
  invite_user_to_slack: [user, user_email]
  remove_user_from_slack: [user]
  get_webpage: [url]      # blocks visiting attacker URLs, but also legit "open the link Bob posted"
  post_webpage: [url]
  # travel
  reserve_hotel: [hotel]
  reserve_restaurant: [restaurant]
  reserve_car_rental: [company]

# The user's own identity: counts as user-given in every session (exact match, like any email).
# Without it, inviting yourself to your own calendar event is blocked (no trusted "who am I" tool in
# workspace). Emma Johnson is the workspace user (and the travel user).
user_identities:
  - emma.johnson@bluesparrowtech.com

# Tools that always need the user's OK, even when every guarded arg is clean (in plain mode: always blocked).
# delete_file takes only an ID, and an ID can't be traced: the injection's "delete file 13" looks exactly
# like a user's "delete file 11". C3 (2026-11-08): the model deleted file 13 after a guard block.
always_confirm:
  - delete_file
  - delete_email                # workspace injection_task_5 deletes its own sent email to hide it
  - cancel_calendar_event       # workspace + travel
  - reschedule_calendar_event   # legit in workspace user_task_7, so confirm mode asks once there

# Free-text arguments: only links / emails / IBANs inside them are checked (wording is ignored).
# Stops "send Alice this link: www.phish.com" when the link came from untrusted data.
check_links_in:
  send_email: [body, subject]
  send_direct_message: [body]
  send_channel_message: [body]

# Confirm mode (only used when a confirm function is supplied): a refused call to one of these tools is
# shown to the user instead of being blocked outright. Money / password tools are deliberately NOT here,
# and neither is share_file (it hands out access to the user's files). update_user_info is: it changes only
# the user's own profile, and the user can check the new address.
confirmable:
  - send_email
  - create_calendar_event
  - add_calendar_event_participants
  - get_webpage
  - post_webpage
  - invite_user_to_slack
  - add_user_to_channel
  - send_direct_message
  - send_channel_message
  - update_user_info   # the user's own profile (banking user_task_13: new address read from a file)
