# Tests on every push and pull request.
#   core:      guard, policy, provenance, init, CLI and the MCP proxy, WITHOUT the AgentDojo extra
#              (tests that need AgentDojo are skipped by tests/conftest.py), on Linux and Windows, Python 3.10-3.12
#   agentdojo: the benchmark-side tests (adapter, executor parity, oracle audit, freeze-clock, ...) with the
#              agentdojo extra. No model is called anywhere: these are offline tests.
name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    env:
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core + proxy, no AgentDojo)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[proxy,test]"
      - name: The tracklimits command runs
        run: tracklimits --help
      - name: Tests
        run: python -m pytest -q -rs

  agentdojo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (with the AgentDojo extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[proxy,agentdojo,test]"
      - name: Tests
        run: python -m pytest -q -rs
