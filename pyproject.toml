[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guard"
version = "0.1.0"
description = "Rule-based provenance guard against indirect prompt injection for LLM agents and MCP tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# The core (guard, policy, provenance, `mcp-guard init`) needs only PyYAML.
dependencies = ["pyyaml>=6.0,<7"]

[project.optional-dependencies]
# `mcp-guard proxy`: the MCP Python SDK 2.x (it brings anyio)
proxy = ["mcp>=2.3,<3"]
# The AgentDojo benchmark harness (scripts/, agentdojo_adapter.py, agentdojo_clock.py). Results were measured
# with agentdojo 0.1.35 (benchmark v1.2.2), so it is pinned exactly.
agentdojo = ["agentdojo==0.1.35", "openai>=1.50,<4", "httpx>=0.27,<1", "python-dotenv>=1.0,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_guard = ["policies/*.yaml"]
