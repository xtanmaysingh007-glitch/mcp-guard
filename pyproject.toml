[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracklimits"
version = "0.1.0"
description = "Provenance-based prompt injection defense for LLM agent tool calls."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# The core (guard, policy, provenance, `tracklimits init`) needs only PyYAML.
dependencies = ["pyyaml>=6.0,<7"]

[project.optional-dependencies]
# `tracklimits proxy`: the MCP Python SDK 2.x (it brings anyio)
proxy = ["mcp>=2.3,<3"]
# The AgentDojo benchmark harness (scripts/, agentdojo_adapter.py, agentdojo_clock.py). Results were measured
# with agentdojo 0.1.35 (benchmark v1.2.2), so it is pinned exactly.
agentdojo = ["agentdojo==0.1.35", "openai>=1.50,<4", "httpx>=0.27,<1", "python-dotenv>=1.0,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
tracklimits = "tracklimits.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracklimits = ["policies/*.yaml"]
